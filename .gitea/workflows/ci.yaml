name: Build & Test Fleet Monitor
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Test FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "*"
          if [ -d .git ]; then
            git remote set-url origin http://172.27.210.154:3001/${{ github.repository }}.git
          else
            git init .
            git remote add origin http://172.27.210.154:3001/${{ github.repository }}.git
          fi
          git fetch --depth 1 origin ${{ github.ref }}
          git checkout --force FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          cd backend
          python test_backend.py
          python test_api_endpoints.py
          python test_alerts_system.py

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "*"
          if [ -d .git ]; then
            git remote set-url origin http://172.27.210.154:3001/${{ github.repository }}.git
          else
            git init .
            git remote add origin http://172.27.210.154:3001/${{ github.repository }}.git
          fi
          git fetch --depth 1 origin ${{ github.ref }}
          git checkout --force FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

